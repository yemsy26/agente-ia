name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compilar-y-probar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar
        run: dotnet build src/Chispa/Chispa.csproj -c Release

      - name: Probar
        run: dotnet test src/Chispa.Tests/Chispa.Tests.csproj -c Release
